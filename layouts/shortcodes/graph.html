{{/* Shortcode: graph
  Usage: {{< graph >}} or {{< graph src="/blog/graph.json" width="1000" height="600" >}}
  Draws the posts <-> tags force graph. Any number of instances per page. */}}
<div class="graph" id="graph-{{ .Ordinal }}"
     data-src="{{ .Get "src" | default "/blog/graph.json" }}"
     data-width="{{ .Get "width" | default 1000 }}"
     data-height="{{ .Get "height" | default 600 }}"></div>
<style>
    .graph svg text {
        fill: currentColor;
    }
</style>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

async function drawChart(el) {
    const response = await fetch(el.dataset.src);
    const data = await response.json();

    const width = Number(el.dataset.width);
    const height = Number(el.dataset.height);

    const edges = data.edges.map(d => ({ ...d }));
    const nodes = data.nodes.map(d => ({ ...d }));

    const simulation = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(edges).id(d => d.id).distance(100))
        .force("charge", d3.forceManyBody().strength(-500))
        .force("x", d3.forceX())
        .force("y", d3.forceY());

    // d3.forceSimulation() assigns each node's starting x/y deterministically
    // (a golden-angle spiral) before any ticking happens, so snapshotting it
    // here lets the live animation below replay from the same start every time.
    const initialPositions = nodes.map(d => ({ x: d.x, y: d.y }));

    const svg = d3.create("svg")
        .attr("width", width)
        .attr("height", height)
        .attr("viewBox", [-width / 2, -height / 2, width, height])
        .attr("style", "max-width: 100%; height: auto;");

    const container = svg.append("g");

    const link = container.append("g")
        .attr("stroke", "#999")
        .attr("stroke-opacity", 0.6)
        .selectAll("line")
        .data(edges)
        .join("line")
        .attr("stroke-width", d => Math.sqrt(d.value || 1));

    const node = container.append("g")
        .attr("stroke", "#fff")
        .attr("stroke-width", 1.5)
        .selectAll("circle")
        .data(nodes)
        .join("circle")
        .attr("r", d => d.title ? 12 : 8)
        .attr("fill", d => d.title ? "#B0CFFF" : "#FFA7CE")
        .call(d3.drag()
            .on("start", dragstarted)
            .on("drag", dragged)
            .on("end", dragended));

    node.append("title").text(d => d.id);

    const label = container.append("g")
        .attr("text-anchor", "middle")
        .selectAll("text")
        .data(nodes)
        .join("a")
        .attr("xlink:href", d => d.title ? `/blog/${d.id}` : `/tags/${d.id}`)
        .attr("target", "_blank") // Open in new tab
        .append("text")
        .attr("font-family", d => d.title ? "inherit" : "monospace")
        .attr("font-size", d => d.title ? 16 : 12)
        .text(d => d.title ? d.title : "#" + d.id);

    // Attach to the document now, before the simulation is run to
    // completion below — getBBox() (used by fitToView) needs the element to
    // actually be rendered to return a meaningful box in every browser.
    // Nothing has painted yet at this point in the synchronous script, so
    // this doesn't cause any visible flash of the unfitted layout.
    el.replaceChildren(svg.node());

    const zoom = d3.zoom()
        .scaleExtent([0.2, 8])
        .on("zoom", (event) => container.attr("transform", event.transform));

    svg.call(zoom);

    simulation.force("labelCollision", d3.forceCollide()
        .radius(20)
        .strength(0.5));

    function ticked() {
        link
            .attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y);

        node
            .attr("cx", d => d.x)
            .attr("cy", d => d.y);

        label
            .attr("x", d => d.x)
            .attr("y", d => d.y - 12);
    }

    function fitToView() {
        const bbox = container.node().getBBox();
        const padding = 40;
        const scale = Math.min(
            8,
            Math.min(
                width / (bbox.width + padding * 2),
                height / (bbox.height + padding * 2)
            )
        );
        // The svg's viewBox is [-width/2, -height/2, width, height], so
        // the visible center in this coordinate space is (0, 0), not
        // (width/2, height/2).
        const tx = -scale * (bbox.x + bbox.width / 2);
        const ty = -scale * (bbox.y + bbox.height / 2);

        svg.call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
    }

    // Run the simulation to completion up front (300 iterations mirrors
    // d3-force's own default alphaDecay/alphaMin schedule) before yielding
    // to the browser for the first paint, so the camera fit below is sized
    // to the real settled layout instead of the still-scattered start.
    simulation.stop();
    simulation.tick(300);
    ticked();
    fitToView();

    // Now rewind the nodes to their starting positions and let the
    // simulation run live from there. The camera transform we just computed
    // stays fixed throughout, since the physics is deterministic given the
    // same start state — so the graph visibly settles into place without
    // the view ever jumping or re-fitting.
    nodes.forEach((d, i) => {
        d.x = initialPositions[i].x;
        d.y = initialPositions[i].y;
        d.vx = 0;
        d.vy = 0;
    });
    ticked();

    simulation.on("tick", ticked);
    simulation.alpha(1).restart();

    function dragstarted(event) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        event.subject.fx = event.subject.x;
        event.subject.fy = event.subject.y;
    }

    function dragged(event) {
        event.subject.fx = event.x;
        event.subject.fy = event.y;
    }

    function dragended(event) {
        if (!event.active) simulation.alphaTarget(0);
        event.subject.fx = null;
        event.subject.fy = null;
    }
}

drawChart(document.getElementById({{ printf "graph-%d" .Ordinal }}));
</script>
