baseURL = "ohaodha.ie"
languageCode = "en-ie"
title = "Ó hAoḋa"
theme = "aevum"
copyright = "Copyright © 2024 Aindréas Ó hAodha. Content licensed under CC BY-NC-SA 4.0. Code licensed under GPLv3."

[taxonomies]
    tag = "tags"

[markup]
    [markup.tableOfContents]
        ordered = true
    [markup.goldmark]
        duplicateResourceFiles = false
        [markup.goldmark.extensions]
            definitionList = true
            footnote = true
            linkify = true
            linkifyProtocol = 'https'
            strikethrough = true
            table = true
            taskList = true
            [markup.goldmark.extensions.cjk]
                eastAsianLineBreaks = false
                eastAsianLineBreaksStyle = 'simple'
                enable = false
                escapedSpace = false
            [markup.goldmark.extensions.passthrough]
                enable = true
                [markup.goldmark.extensions.passthrough.delimiters]
                    block = [['\[', '\]'], ['$$', '$$']]
                    inline = [['\(', '\)'], ['$', '$']]
            [markup.goldmark.extensions.typographer]
                apostrophe = '&rsquo;'
                disable = false
                ellipsis = '&hellip;'
                emDash = '&mdash;'
                enDash = '&ndash;'
                leftAngleQuote = '&laquo;'
                leftDoubleQuote = '&ldquo;'
                leftSingleQuote = '&lsquo;'
                rightAngleQuote = '&raquo;'
                rightDoubleQuote = '&rdquo;'
                rightSingleQuote = '&rsquo;'
        [markup.goldmark.parser]
            autoHeadingID = true
            autoHeadingIDType = 'github'
            wrapStandAloneImageWithinParagraph = false
            [markup.goldmark.parser.attribute]
                block = false
                title = true
        [markup.goldmark.renderHooks]
            [markup.goldmark.renderHooks.image]
                useEmbedded = "never"
            [markup.goldmark.renderHooks.link]
                useEmbedded = "never"

        [markup.goldmark.renderer]
            hardWraps = false
            unsafe = true
            xhtml = false
        [markup.highlight]
            anchorLineNos = false
            codeFences = true
            guessSyntax = true
            hl_Lines = ''
            hl_inline = false
            lineAnchors = ''
            lineNoStart = 1
            lineNos = true
            lineNumbersInTable = false
            noClasses = false
            noHl = false
            style = 'algol_nu'
            tabWidth = 4

[params]
    math = true
